<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">Vixxing</title>
  <desc id="desc">Vixxing stops voice-phishing at the IT help desk: the caller reads a live six-digit TOTP code, and the agent sees Caller Verified before any reset happens.</desc>

  <rect width="1200" height="420" rx="24" fill="#0E1116"/>

  <!-- Reserved subject area: x 760–1160, y 24–270. Replace this group with the generated handset in the hybrid composition. -->
  <g id="subject">
    <g transform="translate(965 150) rotate(-28)">
      <rect x="-150" y="-26" width="300" height="52" rx="26" fill="#1C222B" stroke="#2A313C" stroke-width="2"/>
      <rect x="-190" y="-10" width="104" height="78" rx="34" fill="#1C222B" stroke="#2A313C" stroke-width="2"/>
      <rect x="86" y="-10" width="104" height="78" rx="34" fill="#1C222B" stroke="#2A313C" stroke-width="2"/>
      <path d="M-130 -22 H130" stroke="#2EA66A" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    </g>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="56" y="76" fill="#8B95A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2.5">IT HELP DESK · CALLER VERIFICATION</text>
    <text x="52" y="166" fill="#F2EFE8" font-size="96" font-weight="800" letter-spacing="-2">Vixxing</text>
    <text x="56" y="214" fill="#F2EFE8" font-size="30" font-weight="600">Stop vishing at the help desk.</text>
    <text x="56" y="250" fill="#8B95A3" font-size="22">The caller reads a live code before any reset happens.</text>
  </g>

  <!-- Call band: voice → live code → result -->
  <g id="call-band" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <line x1="56" y1="292" x2="1144" y2="292" stroke="#2A313C" stroke-width="1.5"/>

    <text x="56" y="322" fill="#8B95A3" font-size="17" letter-spacing="1.5">CALLER READS</text>
    <g id="waveform" fill="#3A4350">
      <rect x="56"  y="352" width="6" height="16" rx="3"/>
      <rect x="70"  y="342" width="6" height="36" rx="3"/>
      <rect x="84"  y="334" width="6" height="52" rx="3"/>
      <rect x="98"  y="346" width="6" height="28" rx="3"/>
      <rect x="112" y="338" width="6" height="44" rx="3"/>
      <rect x="126" y="350" width="6" height="20" rx="3"/>
      <rect x="140" y="340" width="6" height="40" rx="3"/>
      <rect x="154" y="332" width="6" height="56" rx="3"/>
      <rect x="168" y="344" width="6" height="32" rx="3"/>
      <rect x="182" y="352" width="6" height="16" rx="3"/>
      <rect x="196" y="346" width="6" height="28" rx="3"/>
      <rect x="210" y="338" width="6" height="44" rx="3"/>
      <rect x="224" y="348" width="6" height="24" rx="3"/>
      <rect x="238" y="354" width="6" height="12" rx="3"/>
    </g>
    <path d="M262 360 H300 M290 351 L300 360 L290 369" stroke="#8B95A3" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="324" y="322" fill="#8B95A3" font-size="17" letter-spacing="1.5">LIVE CODE · ROTATES EVERY 30s</text>
    <g id="code-cells" font-size="36" font-weight="600" fill="#F2EFE8" text-anchor="middle">
      <rect x="324" y="332" width="50" height="58" rx="8" fill="#161B22" stroke="#2A313C" stroke-width="2"/>
      <rect x="382" y="332" width="50" height="58" rx="8" fill="#161B22" stroke="#2A313C" stroke-width="2"/>
      <rect x="440" y="332" width="50" height="58" rx="8" fill="#161B22" stroke="#2A313C" stroke-width="2"/>
      <rect x="516" y="332" width="50" height="58" rx="8" fill="#161B22" stroke="#2A313C" stroke-width="2"/>
      <rect x="574" y="332" width="50" height="58" rx="8" fill="#161B22" stroke="#2A313C" stroke-width="2"/>
      <rect x="632" y="332" width="50" height="58" rx="8" fill="#161B22" stroke="#2A313C" stroke-width="2"/>
      <text x="349" y="374">4</text><text x="407" y="374">8</text><text x="465" y="374">2</text>
      <text x="541" y="374">9</text><text x="599" y="374">1</text><text x="657" y="374">3</text>
    </g>
    <g id="countdown" transform="translate(732 361)">
      <circle r="24" fill="none" stroke="#2A313C" stroke-width="5"/>
      <circle r="24" fill="none" stroke="#2EA66A" stroke-width="5" stroke-linecap="round"
              stroke-dasharray="90.5 150.8" transform="rotate(-90)"/>
      <text y="7" fill="#F2EFE8" font-size="17" text-anchor="middle">18s</text>
    </g>
    <path d="M776 360 H814 M804 351 L814 360 L804 369" stroke="#8B95A3" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="838" y="322" fill="#8B95A3" font-size="17" letter-spacing="1.5">AGENT SEES</text>
    <g id="verified-chip">
      <rect x="838" y="332" width="306" height="58" rx="29" fill="#2EA66A"/>
      <path d="M866 361 L878 373 L900 349" stroke="#0E1116" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="914" y="370" fill="#0E1116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="700">Caller Verified</text>
    </g>
  </g>
</svg>
