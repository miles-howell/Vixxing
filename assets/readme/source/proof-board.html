<!doctype html>
<!-- Composition source for assets/readme/proof.png.
     Screens are real captures of the verify dashboard running with demo employees
     (light theme, 1180x700 viewport at 2x; results are the inline .result banners).
     Re-export: render #board at 1200 CSS px wide, 2x scale. -->
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: transparent; }
  #board {
    width: 1200px; box-sizing: border-box; padding: 40px 48px 44px;
    background: #0E1116; border-radius: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #F2EFE8;
  }
  .eyebrow { font: 17px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; color: #8B95A3; margin: 0 0 16px; }
  .shot { display: block; width: 100%; border-radius: 12px; }
  .note { margin: 14px 0 0; font-size: 18px; color: #8B95A3; }
  .results { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 32px; }
  .result-label { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700; margin: 0 0 12px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .ok .dot { background: #2EA66A; } .ok { color: #2EA66A; }
  .no .dot { background: #E5484D; } .no { color: #E5484D; }
  .banner { padding: 14px; background: #fff; border-radius: 14px; }
  .banner .shot { border-radius: 10px; }
</style>
</head>
<body>
<div id="board">
  <p class="eyebrow">THE AGENT DASHBOARD</p>
  <img class="shot" src="screens/dashboard.png" alt="">
  <p class="note">Demo employees. Find the caller, have them read their code, verify.</p>
  <div class="results">
    <div>
      <p class="result-label ok"><span class="dot"></span>Right code</p>
      <div class="banner"><img class="shot" src="screens/verified.png" alt=""></div>
    </div>
    <div>
      <p class="result-label no"><span class="dot"></span>Wrong or stale code</p>
      <div class="banner"><img class="shot" src="screens/rejected.png" alt=""></div>
    </div>
  </div>
</div>
</body>
</html>
