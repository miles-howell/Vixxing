<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">How a Vixxing verification works</title>
  <desc id="desc">Once: the agent emails the employee a QR code and they scan it into an authenticator app. On every call: the agent asks for the current six-digit code, types it in, and clicks Verify. The server checks it against the stored secret, allowing one 30-second step of clock drift either way, and shows Caller Verified or Invalid code, do not proceed.</desc>

  <rect width="1200" height="380" rx="24" fill="#0E1116"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- Once -->
    <g transform="translate(48 40)">
      <text x="0" y="20" fill="#8B95A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2">ONCE</text>
      <rect y="40" width="252" height="208" rx="16" fill="#161B22" stroke="#2A313C" stroke-width="1.5"/>
      <text x="24" y="86" fill="#2EA66A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600">00 · ENROLL</text>
      <text x="24" y="128" fill="#F2EFE8" font-size="23" font-weight="600">Agent clicks</text>
      <text x="24" y="158" fill="#F2EFE8" font-size="23" font-weight="600">Email QR Code</text>
      <text x="24" y="198" fill="#8B95A3" font-size="20">Employee scans it into</text>
      <text x="24" y="226" fill="#8B95A3" font-size="20">any authenticator app</text>
    </g>

    <line x1="330" y1="60" x2="330" y2="320" stroke="#2A313C" stroke-width="1.5" stroke-dasharray="4 6"/>

    <!-- Every call -->
    <g transform="translate(360 40)">
      <text x="0" y="20" fill="#8B95A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2">ON EVERY CALL</text>

      <g transform="translate(0 40)">
        <rect width="220" height="208" rx="16" fill="#161B22" stroke="#2A313C" stroke-width="1.5"/>
        <text x="24" y="46" fill="#8B95A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600">01 · ASK</text>
        <text x="24" y="88" fill="#F2EFE8" font-size="23" font-weight="600">“Read me the</text>
        <text x="24" y="118" fill="#F2EFE8" font-size="23" font-weight="600">6-digit code.”</text>
        <text x="24" y="158" fill="#8B95A3" font-size="20">From their</text>
        <text x="24" y="186" fill="#8B95A3" font-size="20">enrolled phone</text>
      </g>
      <path d="M228 144 H250 M242 136 L250 144 L242 152" stroke="#8B95A3" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(258 40)">
        <rect width="220" height="208" rx="16" fill="#161B22" stroke="#2A313C" stroke-width="1.5"/>
        <text x="24" y="46" fill="#8B95A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600">02 · VERIFY</text>
        <text x="24" y="88" fill="#F2EFE8" font-size="23" font-weight="600">Agent types it,</text>
        <text x="24" y="118" fill="#F2EFE8" font-size="23" font-weight="600">clicks Verify</text>
        <text x="24" y="158" fill="#8B95A3" font-size="20">Checked against</text>
        <text x="24" y="186" fill="#8B95A3" font-size="20">the secret, ±30s</text>
      </g>
      <path d="M486 144 H508 M500 136 L508 144 L500 152" stroke="#8B95A3" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(516 40)">
        <rect width="276" height="96" rx="16" fill="#2EA66A"/>
        <path d="M24 48 L36 60 L58 36" stroke="#0E1116" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="74" y="44" fill="#0E1116" font-size="23" font-weight="700">Caller Verified</text>
        <text x="74" y="72" fill="#0E1116" font-size="20">Proceed with reset</text>

        <rect y="112" width="276" height="96" rx="16" fill="#161B22" stroke="#E5484D" stroke-width="2"/>
        <path d="M28 146 L52 170 M52 146 L28 170" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/>
        <text x="74" y="156" fill="#F2EFE8" font-size="23" font-weight="700">Invalid code</text>
        <text x="74" y="184" fill="#E5484D" font-size="20">Do not proceed</text>
      </g>
    </g>

    <text x="48" y="342" fill="#8B95A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">TOTP · RFC 6238 · works with Microsoft Authenticator, Google Authenticator, and others</text>
  </g>
</svg>
